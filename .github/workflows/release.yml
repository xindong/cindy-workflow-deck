name: Release Cindy plugin
on:
  push:
    tags: ['v*', '[0-9]*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test plugin and release preparation
        run: |
          npm test
          npm run check
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Build assets from the tagged source
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/prepare_release.py --tag "$RELEASE_TAG"
      - name: Verify generated Release assets
        run: python3 scripts/install_local.py --dir release-assets --check
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          display_name=$(python3 -c 'import json; print(json.load(open("repository-policy.json"))["name"])')
          repository=$(python3 -c 'import json; print(json.load(open("repository-policy.json"))["repository"])')
          if [[ "$GH_REPO" != "$repository" ]]; then echo "Release repository differs from repository-policy.json" >&2; exit 1; fi
          options=()
          version="${RELEASE_TAG%%+*}"
          if [[ "$version" == *-* ]]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$display_name $RELEASE_TAG" --generate-notes "${options[@]}"
