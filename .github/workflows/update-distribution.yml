name: Synchronize source version
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cindy-distribution
  cancel-in-progress: false
jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Synchronize patch or explicit minor version per change commit
        env:
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -z "$PUSH_BASE" ]; then PUSH_BASE=$(git rev-parse HEAD^); fi
          python3 scripts/bump_version.py --push-base "$PUSH_BASE"
      - run: npm test && npm run check
      - run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Keep installable packages out of the repository
        run: test -z "$(git ls-files '*.cindy')"
      - name: Commit synchronized source version if needed
        run: |
          git add package.json plugin/ghost.json README.md
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          version=$(node -p "require('./package.json').version")
          git commit -m "build: synchronize version $version"
          git push origin HEAD:main
